<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IPL Score Predictor</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body class="bg-slate-50 text-gray-800 font-sans antialiased">
    <div class="container mx-auto p-8 max-w-5xl">

        <div class="text-center mb-10">
            <h1
                class="text-5xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-blue-600 to-indigo-600 mb-4">
                IPL First Innings Predictor
            </h1>
            <p class="text-gray-500 text-lg">Machine Learning Driven Match Projections</p>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-2 gap-8">
            <div class="bg-white p-8 rounded-2xl shadow-xl border border-gray-100">
                <form action="/predict" method="POST" class="space-y-6">
                    <div class="grid grid-cols-2 gap-6">
                        <div>
                            <label class="block text-sm font-semibold text-gray-700 mb-2">Batting Team</label>
                            <select name="batting_team"
                                class="w-full bg-slate-50 border border-gray-300 rounded-lg p-3 text-gray-800 focus:ring-2 focus:ring-blue-500 focus:outline-none"
                                required>
                                <option value="Chennai Super Kings">Chennai Super Kings</option>
                                <option value="Delhi Capitals">Delhi Capitals</option>
                                <option value="Gujarat Titans">Gujarat Titans</option>
                                <option value="Kolkata Knight Riders">Kolkata Knight Riders</option>
                                <option value="Lucknow Super Giants">Lucknow Super Giants</option>
                                <option value="Mumbai Indians">Mumbai Indians</option>
                                <option value="Punjab Kings">Punjab Kings</option>
                                <option value="Rajasthan Royals">Rajasthan Royals</option>
                                <option value="Royal Challengers Bengaluru">Royal Challengers Bengaluru</option>
                                <option value="Sunrisers Hyderabad">Sunrisers Hyderabad</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-sm font-semibold text-gray-700 mb-2">Bowling Team</label>
                            <select name="bowling_team"
                                class="w-full bg-slate-50 border border-gray-300 rounded-lg p-3 text-gray-800 focus:ring-2 focus:ring-indigo-500 focus:outline-none"
                                required>
                                <option value="Mumbai Indians">Mumbai Indians</option>
                                <option value="Chennai Super Kings">Chennai Super Kings</option>
                                <option value="Delhi Capitals">Delhi Capitals</option>
                                <option value="Gujarat Titans">Gujarat Titans</option>
                                <option value="Kolkata Knight Riders">Kolkata Knight Riders</option>
                                <option value="Lucknow Super Giants">Lucknow Super Giants</option>
                                <option value="Punjab Kings">Punjab Kings</option>
                                <option value="Rajasthan Royals">Rajasthan Royals</option>
                                <option value="Royal Challengers Bengaluru">Royal Challengers Bengaluru</option>
                                <option value="Sunrisers Hyderabad">Sunrisers Hyderabad</option>
                            </select>
                        </div>
                    </div>

                    <div>
                        <label class="block text-sm font-semibold text-gray-700 mb-2">Venue</label>
                        <select name="city"
                            class="w-full bg-slate-50 border border-gray-300 rounded-lg p-3 text-gray-800 focus:ring-2 focus:ring-blue-500 focus:outline-none"
                            required>
                            <option value="Narendra Modi Stadium, Ahmedabad">Narendra Modi Stadium, Ahmedabad</option>
                            <option value="MA Chidambaram Stadium, Chepauk, Chennai">M.A. Chidambaram Stadium, Chennai
                            </option>
                            <option value="Wankhede Stadium, Mumbai">Wankhede Stadium, Mumbai</option>
                            <option value="M Chinnaswamy Stadium">M. Chinnaswamy Stadium, Bengaluru</option>
                            <option value="Eden Gardens, Kolkata">Eden Gardens, Kolkata</option>
                            <option value="Arun Jaitley Stadium">Arun Jaitley Stadium, Delhi</option>
                            <option value="Rajiv Gandhi International Stadium, Uppal">Rajiv Gandhi Intl Stadium,
                                Hyderabad</option>
                            <option value="Bharat Ratna Shri Atal Bihari Vajpayee Ekana Cricket Stadium">Ekana Cricket
                                Stadium, Lucknow</option>
                            <option value="Sawai Mansingh Stadium">Sawai Mansingh Stadium, Jaipur</option>
                            <option value="Punjab Cricket Association IS Bindra Stadium, Mohali">PCA Stadium, Mohali
                            </option>
                        </select>
                    </div>

                    <div class="grid grid-cols-2 gap-6">
                        <div>
                            <label class="block text-sm font-semibold text-gray-700 mb-2">Current Score</label>
                            <input type="number" name="current_score"
                                class="w-full bg-slate-50 border border-gray-300 rounded-lg p-3 text-gray-800 focus:ring-2 focus:ring-blue-500 focus:outline-none"
                                placeholder="e.g., 110" required>
                        </div>
                        <div>
                            <label class="block text-sm font-semibold text-gray-700 mb-2">Wickets Fallen</label>
                            <input type="number" name="wickets"
                                class="w-full bg-slate-50 border border-gray-300 rounded-lg p-3 text-gray-800 focus:ring-2 focus:ring-blue-500 focus:outline-none"
                                placeholder="e.g., 3" required>
                        </div>
                        <div>
                            <label class="block text-sm font-semibold text-gray-700 mb-2">Overs Completed</label>
                            <input type="number" step="0.1" name="overs"
                                class="w-full bg-slate-50 border border-gray-300 rounded-lg p-3 text-gray-800 focus:ring-2 focus:ring-blue-500 focus:outline-none"
                                placeholder="e.g., 12.4" required>
                        </div>
                        <div>
                            <label class="block text-sm font-semibold text-gray-700 mb-2">Runs in Last 5 Overs</label>
                            <input type="number" name="runs_in_prev_5"
                                class="w-full bg-slate-50 border border-gray-300 rounded-lg p-3 text-gray-800 focus:ring-2 focus:ring-blue-500 focus:outline-none"
                                placeholder="e.g., 45" required>
                        </div>
                    </div>

                    <button type="submit"
                        class="w-full bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-700 hover:to-indigo-700 text-white font-bold py-4 rounded-lg transition duration-300 transform hover:scale-105 shadow-md">
                        Predict Final Score
                    </button>
                </form>
            </div>

            <div
                class="bg-white p-8 rounded-2xl shadow-xl border border-gray-100 flex flex-col justify-center items-center min-h-[400px]">
                {% if result %}
                <div class="w-full text-center mb-6">
                    <h2 class="text-xl font-bold text-gray-500 uppercase tracking-wide">Projected Target</h2>
                    <p
                        class="text-6xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-green-500 to-emerald-600 mt-2">
                        {{ result }}
                    </p>
                    <p class="text-sm text-gray-400 mt-1">Expected range: {{ result - 5 }} to {{ result + 10 }}</p>
                </div>

                <div class="w-full">
                    <canvas id="predictionChart"></canvas>
                </div>

                <script>
                    const ctx = document.getElementById('predictionChart').getContext('2d');

                    // Grabbing variables passed from Flask
                    const currentOvers = Number('{{ overs }}');
                    const currentScore = Number('{{ current_score }}');
                    const predictedScore = Number('{{ result }}');

                    const chart = new Chart(ctx, {
                        type: 'line',
                        data: {
                            datasets: [{
                                label: 'Score Trajectory',
                                data: [
                                    {x: 0, y: 0},
                                    {x: currentOvers, y: currentScore},
                                    {x: 20, y: predictedScore}
                                ],
                                borderColor: '#4F46E5', // Indigo color
                                backgroundColor: 'rgba(79, 70, 229, 0.1)',
                                borderWidth: 3,
                                pointBackgroundColor: ['#fff', '#4F46E5', '#10B981'],
                                pointBorderColor: ['#ccc', '#4F46E5', '#10B981'],
                                pointRadius: [0, 6, 8],
                                fill: true,
                                tension: 0.3 // Smooth curve
                            }]
                        },
                        options: {
                            responsive: true,
                            plugins: {
                                legend: { display: false }
                            },
                            scales: {
                                x: {
                                    type: 'linear',
                                    title: { display: true, text: 'Overs' },
                                    min: 0,
                                    max: 20,
                                    ticks: {
                                        stepSize: 5
                                    }
                                },
                                y: {
                                    title: { display: true, text: 'Runs' },
                                    beginAtZero: true
                                }
                            }
                        }
                    });
                </script>
                {% else %}
                <div class="text-center text-gray-400">
                    <svg class="w-24 h-24 mx-auto text-gray-200 mb-4" fill="none" stroke="currentColor"
                        viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z">
                        </path>
                    </svg>
                    <p class="text-lg">Fill out the match situation and click Predict to see the trajectory.</p>
                </div>
                {% endif %}
            </div>
        </div>
    </div>
</body>

</html>
